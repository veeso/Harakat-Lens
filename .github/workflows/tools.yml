name: Tools CI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-quran-json:
    name: build-quran-json.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install ICU system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Syntax check
        run: python -m py_compile tools/build-quran-json.py

      - name: Run build-quran-json.py
        run: python tools/build-quran-json.py --out-dir "$RUNNER_TEMP/quran-out"

      - name: Validate output
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quran-out"
          test -f "$OUT/quran.json"
          test -f "$OUT/surah-names.json"
          AYAT=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$OUT/quran.json")
          SURAHS=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$OUT/surah-names.json")
          echo "ayat=$AYAT surahs=$SURAHS"
          test "$AYAT" = "6236"
          test "$SURAHS" = "114"
          # Confirm PyICU populated transliteration field
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d[0]["transliteration"], "transliteration empty"' "$OUT/quran.json"
